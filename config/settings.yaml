# =============================================================
# InvestAid - Brugerindstillinger
# =============================================================

risk:
  # Paper trading = simuleret handel (ALTID start her!)
  paper_trading: true

  # Maksimalt beløb der må være investeret ad gangen (USD)
  max_portfolio_value: 5000.0

  # Maksimal andel af portefølje i én aktie (5% = 0.05)
  max_position_pct: 0.05

  # Stop-loss: sælg automatisk hvis positionen falder med X%
  stop_loss_pct: 0.05

  # Take-profit: sælg automatisk hvis positionen stiger med X%
  take_profit_pct: 0.15

  # Stop al handel for dagen hvis porteføljen falder med X%
  max_daily_loss_pct: 0.02

strategy:
  # Aktiver/deaktiver individuelle strategier
  trend_following_enabled: true
  momentum_enabled: true
  rebalancing_enabled: true

  # Hvor ofte tjekkes signaler (minutter)
  check_interval_minutes: 15

  # EMA Trend Following indstillinger
  ema_fast_period: 12
  ema_slow_period: 26

  # RSI Momentum indstillinger
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70

  # Rebalancering: hvor tit (dage)
  rebalancing_interval_days: 30

watchlist:
  # Aktier og ETF'er der overvåges og handles
  symbols:
    # Brede markedsindekser
    - SPY      # S&P 500 ETF
    - QQQ      # Nasdaq 100 ETF
    - VTI      # Vanguard Total Market
    # Guld
    - GLD      # SPDR Gold ETF
    - IAU      # iShares Gold ETF
    # Obligationer (stabilitet)
    - AGG      # iShares Core US Aggregate Bond
    # Krypto (via Alpaca)
    - BTC/USD
    - ETH/USD

scheduler:
  # Markedstimer: NYSE åbner 09:30, lukker 16:00 ET
  market_open: "09:30"
  market_close: "16:00"
  timezone: "America/New_York"

  # Kør strategi-check på hverdage
  run_on_weekends: false
