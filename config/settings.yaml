# =============================================================
# InvestAid - Konfiguration
#
# VIGTIGT: Disse indstillinger sættes automatisk af setup-wizarden
# i dashboardet første gang du starter programmet.
# Du behøver ikke redigere denne fil manuelt.
#
# Profil: moderate (Balanceret vækst)
# Kilde: Vanguard LifeStrategy Moderate / Fama-French trefaktormodel
# =============================================================

risk_profile: moderate

risk:
  paper_trading: true
  max_portfolio_value: 5000.0
  max_position_pct: 0.07
  stop_loss_pct: 0.10
  take_profit_pct: 0.25
  max_daily_loss_pct: 0.02
  min_order_notional: 50.0

strategy:
  trend_following_enabled: true
  momentum_enabled: true
  rebalancing_enabled: true
  check_interval_minutes: 15
  ema_fast_period: 20
  ema_slow_period: 50
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  rebalancing_interval_days: 60

watchlist:
  symbols:
    - SPY
    - QQQ
    - VTI
    - VXUS
    - GLD
    - AGG
    - SCHD
    - VIG
    - BTC/USD
    - ETH/USD

scheduler:
  market_open: '09:30'
  market_close: '16:00'
  timezone: America/New_York
  run_on_weekends: false
